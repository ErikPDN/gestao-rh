syntax = "proto3";

package funcionario;

service FuncionarioService {
    rpc GetFuncionario (GetFuncionarioRequest) returns (FuncionarioResponse);
    rpc ContarPorDepartamento (ContarPorDepartamentoRequest) returns (ContarPorDepartamentoResponse);
}

message GetFuncionarioRequest {
    string id = 1;
}

message FuncionarioResponse {
    string id = 1;
    string nome = 2;
    string cargoId = 3;
    string departamentoId = 4;
    double salario = 5;
    optional string dataDemissao = 6;
}

message ContarPorDepartamentoRequest {
    repeated string departamentoIds = 1;
}

message ContagemDepartamento {
    string departamentoId = 1;
    int32 quantidadeFuncionarios = 2;
}

message ContarPorDepartamentoResponse {
    repeated ContagemDepartamento contagens = 1;
}
