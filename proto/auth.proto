syntax = "proto3";

package auth;

service AuthService {
    rpc Login (LoginRequest) returns (AuthResponse);
    rpc Refresh (RefreshRequest) returns (AuthResponse);
    rpc Logout (LogoutRequest) returns (LogoutResponse);
    rpc CriarUsuario (CriarUsuarioRequest) returns (UsuarioResponse);
    rpc GetUsuario (GetUsuarioRequest) returns (UsuarioResponse);
    rpc AlterarSenha (AlterarSenhaRequest) returns (AlterarSenhaResponse);
    rpc UploadAvatar (UploadAvatarRequest) returns (UploadAvatarResponse);
    rpc DeleteAvatar (DeleteAvatarRequest) returns (DeleteAvatarResponse);
    rpc GetAvatares (GetAvataresRequest) returns (GetAvataresResponse);
}

message LoginRequest {
    string email = 1;
    string senha = 2;
}

message RefreshRequest {
    string refreshToken = 1;
}

message LogoutRequest {
    string refreshToken = 1;
}

message LogoutResponse {
    bool success = 1;
}

message AlterarSenhaRequest {
    string id = 1; // vem do JWT(sub), nunca do body
    string senhaAtual = 2;
    string senhaNova = 3;
}

message AlterarSenhaResponse {}

message UploadAvatarRequest {
    string usuarioId = 1;
    bytes conteudo = 2;
    string contentType = 3;
}

message UploadAvatarResponse {
    string avatarUrl = 1;
}

message DeleteAvatarRequest {
    string usuarioId = 1;
}

message DeleteAvatarResponse {}

message GetAvataresRequest {
    repeated string funcionarioIds = 1;
}

message AvatarFuncionario {
    string funcionarioId = 1;
    string avatarUrl = 2;
}

message GetAvataresResponse {
    repeated AvatarFuncionario avatares = 1;
}

message AuthResponse {
    string accessToken = 1;
    string refreshToken = 2;
    int32 expiresIn = 3;
    UsuarioResponse usuario = 4;
}

message CriarUsuarioRequest {
    string email = 1;
    string senha = 2;
    repeated string roles = 3;
    string funcionarioId = 4;
}

message GetUsuarioRequest {
    string id = 1;
}

message UsuarioResponse {
    string id = 1;
    string email = 2;
    repeated string roles = 3;
    string funcionarioId = 4;
    optional string nome = 5;
    optional string avatarUrl = 6;
    optional string cargo = 7;
    optional string departamento = 8;
}